<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2: Dynamic Element Creator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background: #218838;
        }
        .paragraph-item {
            padding: 10px;
            margin: 10px 0;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            padding: 6px 12px;
            font-size: 14px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <h1>Dynamic Paragraph Creator</h1>
    <button id="addParagraph">Add New Paragraph</button>
    <div id="paragraphContainer"></div>
    
    <script>
        let paragraphCount = 0;
        const container = document.getElementById('paragraphContainer');
        
        document.getElementById('addParagraph').addEventListener('click', () => {
            paragraphCount++;
            
            const div = document.createElement('div');
            div.className = 'paragraph-item';
            div.innerHTML = `
                <span>Paragraph ${paragraphCount}: This is dynamically created content!</span>
                <button class="delete-btn">Delete</button>
            `;
            
            container.appendChild(div);
        });
        
        container.addEventListener('click', (event) => {
            if (event.target.classList.contains('delete-btn')) {
                event.target.parentElement.remove();
            }
        });
    </script>
</body>
</html>
